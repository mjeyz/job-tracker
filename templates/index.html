<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #eaeafb">

    <!-- Navbar directly here -->
    <nav class="navbar navbar-expand-lg bg-dark" style="background-color: rgba(0, 0, 0, 0.8)">
        <div class="container px-5 px-lg-5 d-flex align-items-center justify-content-between">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <h2 class="nav-heading text-white">Job Tracker</h2>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarResponsive" aria-controls="navbarResponsive"
                    aria-expanded="false" aria-label="Toggle navigation"
                    style="border-color: rgba(255, 255, 255, 0.5);">
                <span class="navbar-toggler-icon" style="filter: brightness(0) invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarResponsive">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link mx-2 text-white" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link mx-2 text-white" href="/about">About</a></li>
                    <li class="nav-item"><a class="nav-link mx-2 text-white" href="/contact">Contact</a></li>
                    {% if current_user.is_authenticated %}
                    <li class="nav-item"><a class="nav-link mx-2 text-white" href="/logout">Logout</a></li>
                    {% else %}
                    <li class="nav-item"><a class="nav-link mx-2 text-white" href="/register">Register</a></li>
                    <li class="nav-item"><a class="nav-link mx-2 text-white" href="/login">Login</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Your page content below -->
    <div class="container mt-4">
        <h1>Welcome to Job Tracker</h1>
    </div>

    <div class="container mt-5 d-flex">
        <h2>My Applications</h2>
        <div>
        <div class="container p-2 rounded bg-white">
            <p>Total</p>
            <p>3</p>
        </div>
            </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
